packages:
  - astro
  - frontend
  - hono

# Settings <https://pnpm.io/settings>

## Dependency Resolution

minimumReleaseAgeExclude:
  - '@types/*'
  - '@w0s/*'
  - oxlint-plugin-safely-storage
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3 # @astrojs/check@0.9.10 <https://github.com/withastro/astro/blob/main/packages/language-tools/astro-check/package.json>
blockExoticSubdeps: true

## Dependency Hoisting Settings

publicHoistPattern:
  - 'markuplint'
  - 'stylelint'

## Peer Dependency Settings

strictPeerDependencies: true

## CLI Settings

engineStrict: true

## Build Settings

strictDepBuilds: true
allowBuilds:
  better-sqlite3: true
  esbuild: true

## Other Settings

savePrefix: ''
